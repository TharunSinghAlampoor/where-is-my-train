<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Indian Railway Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #0d1117; 
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animations */
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 153, 0.7); }
            70% { transform: translateX(-50%) scale(1.6); box-shadow: 0 0 0 12px rgba(0, 255, 153, 0); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 153, 0); }
        }
        
        @keyframes trainMove {
            0% { transform: translateX(-50%) translateY(0px); }
            25% { transform: translateX(-50%) translateY(-2px); }
            50% { transform: translateX(-50%) translateY(-3px); }
            75% { transform: translateX(-50%) translateY(-2px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }
        
        @keyframes progressPulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .station-pulse { 
            animation: pulse 1.5s infinite ease-in-out; 
        }
        .train-moving { 
            animation: trainMove 0.8s infinite ease-in-out; 
        }
        .progress-pulse { 
            animation: progressPulse 1s infinite; 
        }
        
        /* Audio Controls */
        .audio-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 40, 0, 0.8);
            border: 1px solid #00cc66;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        
        .volume-slider {
            width: 80px;
            accent-color: #00cc66;
        }
        
        .sound-toggle {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 5px 10px;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
        }
        
        .sound-toggle.active {
            background: #00cc66;
            color: #000;
            border-color: #00cc66;
        }
        
        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #161b22;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #00cc66;
        }
        
        /* Auto-scroll indicator */
        .auto-scroll-indicator {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 255, 153, 0.2);
            border: 1px solid #00ff99;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 12px;
            color: #00ff99;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            animation: fadeInOut 3s infinite;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>

        class TrainTracker {
            constructor() {
                this.state = {
                    train: null,
                    currentStationIndex: 0,
                    progress: 0,
                    isHalted: true,
                    haltCountdown: 0,
                    isFinished: false,
                    trainStatus: "Select a train",
                    soundPlaying: false,
                    volume: 0.3,
                    soundEnabled: true,
                    viewMode: 'tracking', // 'tracking' or 'details'
                    autoScroll: true // Auto-scroll to current train position
                };
                
                this.timer = null;
                this.audioContext = null;
                this.movingSoundInterval = null;
                this.scrollInterval = null;
                
                this.init();
            }
            
            init() {
                this.renderApp();
                this.bindEvents();
            }
            
            bindEvents() {
                const root = document.getElementById('root');
                
                root.addEventListener('click', (e) => {
                    const trainCard = e.target.closest('.train-card');
                    if (trainCard && trainCard.dataset.trainNo) {
                        this.selectTrain(TRAINS[trainCard.dataset.trainNo]);
                    }
                    
                    const soundToggle = e.target.closest('.sound-toggle');
                    if (soundToggle) {
                        this.toggleSound();
                    }
                    
                    const backBtn = e.target.closest('.back-btn');
                    if (backBtn) {
                        this.clearTimer();
                        this.state.train = null;
                        this.state.viewMode = 'tracking';
                        this.renderApp();
                    }
                    
                    const viewToggle = e.target.closest('.view-toggle');
                    if (viewToggle && this.state.train) {
                        this.state.viewMode = this.state.viewMode === 'tracking' ? 'details' : 'tracking';
                        this.renderApp();
                    }
                    
                    const tabBtn = e.target.closest('.tab-btn');
                    if (tabBtn && this.state.train) {
                        const tabs = document.querySelectorAll('.tab-btn');
                        tabs.forEach(tab => tab.classList.remove('active'));
                        tabBtn.classList.add('active');
                        this.renderTrainDetails();
                    }
                    
                    const autoScrollToggle = e.target.closest('.auto-scroll-toggle');
                    if (autoScrollToggle) {
                        this.state.autoScroll = !this.state.autoScroll;
                        this.renderApp();
                    }
                });
                
                root.addEventListener('input', (e) => {
                    if (e.target.classList.contains('volume-slider')) {
                        this.state.volume = parseFloat(e.target.value);
                        this.renderApp();
                    }
                });
                
                // Listen for manual scroll to disable auto-scroll temporarily
                const centerPanel = document.querySelector('.center-panel');
                if (centerPanel) {
                    centerPanel.addEventListener('scroll', () => {
                        if (this.state.autoScroll) {
                            this.state.autoScroll = false;
                            this.renderApp();
                        }
                    });
                }
            }
            
            // Auto-scroll to keep train in view
            autoScrollToTrain() {
                if (!this.state.train || !this.state.autoScroll || this.state.viewMode !== 'tracking') return;
                
                const trackArea = document.querySelector('.track-area');
                const trainIcon = document.querySelector('.train-icon');
                
                if (!trackArea || !trainIcon) return;
                
                const trainTop = trainIcon.offsetTop;
                const containerHeight = trackArea.clientHeight;
                const scrollTop = trackArea.scrollTop;
                
                // Calculate target scroll position to center the train
                const targetScroll = trainTop - (containerHeight / 2) + 50;
                
                // Smooth scroll to target position
                trackArea.scrollTo({
                    top: targetScroll,
                    behavior: 'smooth'
                });
            }
            
            // Audio Functions
            initAudio() {
                if (!this.state.soundEnabled) return;
                
                if (!this.audioContext) {
                    try {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        this.audioContext.resume();
                    } catch (e) {
                        console.log("Audio not supported");
                    }
                }
            }
            
            playTrainWhistle() {
                if (!this.state.soundEnabled) return;
                
                try {
                    this.initAudio();
                    if (!this.audioContext) return;
                    
                    const ctx = this.audioContext;
                    const currentTime = ctx.currentTime;
                    const volume = this.state.volume * 0.3;
                    
                    const whistle = ctx.createOscillator();
                    const whistleGain = ctx.createGain();
                    
                    whistle.type = "sine";
                    whistle.frequency.setValueAtTime(440, currentTime);
                    whistle.frequency.exponentialRampToValueAtTime(523.25, currentTime + 0.3);
                    whistle.frequency.exponentialRampToValueAtTime(392, currentTime + 0.6);
                    
                    whistleGain.gain.setValueAtTime(0, currentTime);
                    whistleGain.gain.linearRampToValueAtTime(volume, currentTime + 0.1);
                    whistleGain.gain.exponentialRampToValueAtTime(0.001, currentTime + 0.8);
                    
                    whistle.connect(whistleGain);
                    whistleGain.connect(ctx.destination);
                    
                    whistle.start(currentTime);
                    whistle.stop(currentTime + 0.8);
                    
                } catch (e) {
                    console.log("Error playing whistle");
                }
            }
            
            playStationBell() {
                if (!this.state.soundEnabled) return;
                
                try {
                    this.initAudio();
                    if (!this.audioContext) return;
                    
                    const ctx = this.audioContext;
                    const currentTime = ctx.currentTime;
                    const volume = this.state.volume * 0.2;
                    
                    const bellFrequencies = [784, 880, 784];
                    
                    bellFrequencies.forEach((freq, index) => {
                        const bellOsc = ctx.createOscillator();
                        const bellGain = ctx.createGain();
                        
                        bellOsc.type = "sine";
                        bellOsc.frequency.setValueAtTime(freq, currentTime + (index * 0.3));
                        
                        bellGain.gain.setValueAtTime(0, currentTime + (index * 0.3));
                        bellGain.gain.linearRampToValueAtTime(volume, currentTime + (index * 0.3) + 0.1);
                        bellGain.gain.exponentialRampToValueAtTime(0.001, currentTime + (index * 0.3) + 0.5);
                        
                        bellOsc.connect(bellGain);
                        bellGain.connect(ctx.destination);
                        
                        bellOsc.start(currentTime + (index * 0.3));
                        bellOsc.stop(currentTime + (index * 0.3) + 0.5);
                    });
                    
                } catch (e) {
                    console.log("Error playing bell");
                }
            }
            
            startContinuousMovingSound() {
                if (!this.state.soundEnabled || this.movingSoundInterval) return;
                
                this.movingSoundInterval = setInterval(() => {
                    if (!this.state.train || this.state.isHalted || this.state.isFinished || !this.audioContext) {
                        clearInterval(this.movingSoundInterval);
                        this.movingSoundInterval = null;
                        return;
                    }
                    
                    try {
                        const ctx = this.audioContext;
                        const currentTime = ctx.currentTime;
                        const volume = this.state.volume * 0.1;
                        
                        const wheelOsc = ctx.createOscillator();
                        const wheelGain = ctx.createGain();
                        
                        wheelOsc.type = "sine";
                        wheelOsc.frequency.setValueAtTime(180 + Math.random() * 20, currentTime);
                        
                        wheelGain.gain.setValueAtTime(volume, currentTime);
                        wheelGain.gain.exponentialRampToValueAtTime(0.001, currentTime + 0.3);
                        
                        wheelOsc.connect(wheelGain);
                        wheelGain.connect(ctx.destination);
                        
                        wheelOsc.start(currentTime);
                        wheelOsc.stop(currentTime + 0.3);
                        
                    } catch (e) {
                        console.log("Error playing moving sound");
                    }
                }, 300);
            }
            
            playTrainArrivalSound() {
                if (this.state.soundPlaying || !this.state.soundEnabled) return;
                
                this.state.soundPlaying = true;
                
                if (this.movingSoundInterval) {
                    clearInterval(this.movingSoundInterval);
                    this.movingSoundInterval = null;
                }
                
                this.playTrainWhistle();
                setTimeout(() => {
                    this.playStationBell();
                    this.state.soundPlaying = false;
                }, 500);
                
                this.renderApp();
            }
            
            playTrainDepartureSound() {
                if (this.state.soundPlaying || !this.state.soundEnabled) return;
                
                this.state.soundPlaying = true;
                
                this.playStationBell();
                
                setTimeout(() => {
                    this.playTrainWhistle();
                    setTimeout(() => {
                        this.startContinuousMovingSound();
                        this.state.soundPlaying = false;
                        this.renderApp();
                    }, 500);
                }, 800);
            }
            
            clearTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
                if (this.movingSoundInterval) {
                    clearInterval(this.movingSoundInterval);
                    this.movingSoundInterval = null;
                }
                if (this.scrollInterval) {
                    clearInterval(this.scrollInterval);
                    this.scrollInterval = null;
                }
            }
            
            toggleSound() {
                this.state.soundEnabled = !this.state.soundEnabled;
                if (!this.state.soundEnabled) {
                    this.clearTimer();
                }
                this.renderApp();
            }
            
            selectTrain(train) {
                this.clearTimer();
                this.state.train = train;
                this.state.currentStationIndex = 0;
                this.state.progress = 0;
                this.state.isHalted = true;
                this.state.haltCountdown = 0;
                this.state.isFinished = false;
                this.state.viewMode = 'tracking';
                this.state.autoScroll = true;
                
                if (this.state.soundEnabled) {
                    this.playStationBell();
                }
                
                this.state.trainStatus = `Stopped at ${train.route[0].station}`;
                this.startTrainTimer();
                this.startAutoScroll();
                this.renderApp();
                
                // Scroll to top when selecting new train
                setTimeout(() => {
                    const centerPanel = document.querySelector('.center-panel');
                    if (centerPanel) {
                        centerPanel.scrollTop = 0;
                    }
                }, 100);
            }
            
            startTrainTimer() {
                if (!this.state.train) return;
                
                if (this.state.isFinished) {
                    this.clearTimer();
                    return;
                }
                
                this.clearTimer();
                
                this.timer = setInterval(() => {
                    if (this.state.isHalted) {
                        this.state.haltCountdown++;
                        
                        if (this.state.haltCountdown >= 10) {
                            if (this.state.currentStationIndex === this.state.train.route.length - 1) {
                                this.state.isFinished = true;
                                this.clearTimer();
                                this.playTrainArrivalSound();
                                this.state.trainStatus = `Arrived at final destination: ${this.state.train.route[this.state.currentStationIndex].station}`;
                                this.state.haltCountdown = 0;
                            } else {
                                this.state.isHalted = false;
                                this.state.progress = 0;
                                this.playTrainDepartureSound();
                                this.state.trainStatus = `Departing from ${this.state.train.route[this.state.currentStationIndex].station}`;
                                this.state.haltCountdown = 0;
                            }
                        }
                    } else {
                        this.state.progress += 10;
                        
                        if (this.state.progress >= 100) {
                            const nextStationIndex = this.state.currentStationIndex + 1;
                            this.state.currentStationIndex = nextStationIndex;
                            this.state.isHalted = true;
                            this.state.haltCountdown = 0;
                            this.playTrainArrivalSound();
                            this.state.trainStatus = `Arrived at ${this.state.train.route[nextStationIndex].station}`;
                            this.state.progress = 100;
                        }
                    }
                    
                    this.renderApp();
                }, 1000);
            }
            
            startAutoScroll() {
                if (this.scrollInterval) {
                    clearInterval(this.scrollInterval);
                }
                
                this.scrollInterval = setInterval(() => {
                    if (this.state.autoScroll && this.state.train && this.state.viewMode === 'tracking') {
                        this.autoScrollToTrain();
                    }
                }, 1000);
            }
            
            calculateTrainPosition() {
                if (!this.state.train) return 0;
                
                const stationHeight = 100;
                
                if (this.state.isFinished) {
                    return (this.state.train.route.length - 1) * stationHeight + 10;
                }
                
                const basePosition = this.state.currentStationIndex * stationHeight;
                
                if (this.state.isHalted) {
                    return basePosition + 10;
                }
                
                const movement = (this.state.progress / 100) * stationHeight;
                return basePosition + 10 + movement;
            }
            
            getCurrentStation() {
                return this.state.train?.route[this.state.currentStationIndex] || this.state.train?.route[0];
            }
            
            getNextStation() {
                if (!this.state.train || this.state.isFinished || this.state.currentStationIndex >= this.state.train.route.length - 1) {
                    return null;
                }
                return this.state.train.route[this.state.currentStationIndex + 1];
            }

                        margin-bottom: 10px;
                    }
                    
                    .stat-value {
                        font-size: 20px;
                        font-weight: bold;
                        color: #00ff99;
                        margin-bottom: 5px;
                    }
                    
                    .stat-label {
                        font-size: 12px;
                        color: #8b949e;
                    }
                    
                    .route-info h4 {
                        font-size: 16px;
                        color: #c9d1d9;
                        margin-bottom: 15px;
                        padding-bottom: 10px;
                        border-bottom: 1px solid #30363d;
                    }
                    
                    .route-stats {
                        display: flex;
                        flex-direction: column;
                        gap: 10px;
                    }
                    
                    .route-stat {
                        display: flex;
                        justify-content: space-between;
                        padding: 10px 0;
                        border-bottom: 1px solid #30363d;
                    }
                    
                    .route-stat:last-child {
                        border-bottom: none;
                    }
                    
                    .route-stat span {
                        font-size: 14px;
                        color: #8b949e;
                    }
                    
                    .route-stat strong {
                        font-size: 14px;
                        color: #ffffff;
                    }
                    
                    .facilities-details {
                        display: flex;
                        flex-direction: column;
                        gap: 30px;
                    }
                    
                    .facilities-grid-large {
                        display: grid;
                        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                        gap: 15px;
                    }
                    
                    .facility-card {
                        background: #21262d;
                        padding: 20px;
                        border-radius: 10px;
                        text-align: center;
                        border: 1px solid #30363d;
                        transition: transform 0.2s;
                    }
                    
                    .facility-card:hover {
                        transform: translateY(-5px);
                        border-color: #00ff99;
                    }
                    
                    .facility-icon {
                        font-size: 24px;
                        margin-bottom: 10px;
                    }
                    
                    .facility-name {
                        font-size: 14px;
                        color: #ffffff;
                        font-weight: 500;
                    }
                    
                    .train-summary {
                        background: #21262d;
                        padding: 20px;
                        border-radius: 10px;
                        border: 1px solid #30363d;
                    }
                    
                    .train-summary h4 {
                        font-size: 16px;
                        color: #c9d1d9;
                        margin-bottom: 15px;
                        padding-bottom: 10px;
                        border-bottom: 1px solid #30363d;
                    }
                    
                    .train-summary p {
                        font-size: 14px;
                        color: #8b949e;
                        line-height: 1.6;
                        margin-bottom: 10px;
                    }
                    
                    /* Welcome Screen */
                    .welcome-screen {
                        text-align: center;
                        padding: 40px;
                        flex: 1;
                        overflow-y: auto;
                    }
                    
                    .welcome-icon {
                        font-size: 64px;
                        margin-bottom: 20px;
                    }
                    
                    .welcome-screen h1 {
                        font-size: 32px;
                        margin-bottom: 10px;
                        font-weight: bold;
                    }
                    
                    .welcome-subtitle {
                        font-size: 18px;
                        opacity: 0.7;
                        margin-bottom: 40px;
                        color: #8b949e;
                    }
                    
                    .welcome-stats {
                        display: flex;
                        justify-content: center;
                        flex-wrap: wrap;
                        gap: 30px;
                        margin-bottom: 40px;
                    }
                    
                    .stat-box {
                        background: #161b22;
                        padding: 20px;
                        border-radius: 10px;
                        min-width: 120px;
                        border: 1px solid #30363d;
                    }
                    
                    .stat-number {
                        font-size: 28px;
                        font-weight: bold;
                        color: #00ff99;
                        margin-bottom: 5px;
                    }
                    
                    .stat-label {
                        font-size: 12px;
                        color: #8b949e;
                    }
                    
                    .welcome-info {
                        max-width: 600px;
                        margin: 0 auto;
                    }
                    
                    .info-box {
                        padding: 30px;
                        background: #161b22;
                        border-radius: 15px;
                        border: 1px solid #30363d;
                    }
                    
                    .info-title {
                        color: #00cc66;
                        font-size: 18px;
                        margin-bottom: 25px;
                        font-weight: 600;
                    }
                    
                    .features-grid {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                        gap: 15px;
                        margin-bottom: 30px;
                    }
                    
                    .feature-item {
                        background: #21262d;
                        padding: 15px;
                        border-radius: 8px;
                        text-align: center;
                        border: 1px solid #30363d;
                    }
                    
                    .feature-icon {
                        font-size: 20px;
                        margin-bottom: 8px;
                    }
                    
                    .feature-text {
                        font-size: 12px;
                        color: #ffffff;
                    }
                    
                    .train-types {
                        display: flex;
                        flex-wrap: wrap;
                        gap: 10px;
                        justify-content: center;
                        margin: 25px 0;
                    }
                    
                    .type-tag {
                        background: rgba(0, 255, 153, 0.1);
                        color: #00ff99;
                        padding: 6px 12px;
                        border-radius: 15px;
                        font-size: 11px;
                        border: 1px solid #00ff99;
                    }
                    
                    .info-note {
                        margin-top: 20px;
                        font-size: 14px;
                        color: #00ff99;
                        font-style: italic;
                    }
                    
                    .info-tip {
                        font-size: 12px;
                        color: #8b949e;
                        margin-top: 15px;
                        padding: 10px;
                        background: rgba(0, 255, 153, 0.05);
                        border-radius: 8px;
                        border-left: 3px solid #00ff99;
                    }
                `;
            }
        }

        // Initialize the app when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new TrainTracker();
        });
    </script>
</body>
</html>
